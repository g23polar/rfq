[project]
name = "rfq"
version = "0.1.0"
description = "Agent that turns a messy RFQ into a reviewable draft quote"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.40",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pypdf>=6.20.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
